name: long-duration-soak

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Soak duration (for example 30s, 15m, 1h)
        required: true
        default: 30s
        type: string
      interval:
        description: Delay between workload operations
        required: true
        default: 250ms
        type: string
      sample_interval:
        description: Runtime metrics sampling interval
        required: true
        default: 1m
        type: string
      mmu_corpus_pages:
        description: Persisted MMU metadata corpus size
        required: true
        default: '10000'
        type: string
      max_heap_growth_mb:
        description: Maximum retained Go heap growth after final GC
        required: true
        default: '64'
        type: string
      max_goroutine_growth:
        description: Maximum retained goroutine growth
        required: true
        default: '16'
        type: string

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: Run tagged long-duration scenarios
        env:
          SOAK_DURATION: ${{ inputs.duration }}
          SOAK_INTERVAL: ${{ inputs.interval }}
          SOAK_SAMPLE_INTERVAL: ${{ inputs.sample_interval }}
          SOAK_MMU_CORPUS_PAGES: ${{ inputs.mmu_corpus_pages }}
          SOAK_MAX_HEAP_GROWTH_MB: ${{ inputs.max_heap_growth_mb }}
          SOAK_MAX_GOROUTINE_GROWTH: ${{ inputs.max_goroutine_growth }}
        run: >-
          go test -v -tags=soak -run '^TestSoak' -count=1 -timeout=350m
          ./internal/mmu ./internal/storage/sqlite
