name: g13-tidy

on:
  push:
    branches:
      - g13-production-tui

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply deterministic G13 source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          model = Path("internal/tui/model.go")
          text = model.read_text()
          text = text.replace('case "ask", "plan", "act", "review", "observe":', 'case "ask", "act", "observe":')
          model.write_text(text)

          render = Path("internal/tui/render.go")
          text = render.read_text()
          text = text.replace('color := func(value string) lipgloss.Color { return lipgloss.Color(value) }', 'color := lipgloss.Color')
          render.write_text(text)
          PY
          gofmt -w internal/tui/model.go internal/tui/render.go
      - run: go mod tidy
      - name: Commit generated fixes and module locks
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/tui/model.go internal/tui/render.go go.mod go.sum
          git commit -m "G13: fix TUI build and tidy dependencies"
          git push
