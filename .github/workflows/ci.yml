name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - run: go test ./...

      - name: Compile long-duration soak scenarios
        if: runner.os == 'Linux'
        run: go test -tags=soak -run '^$' ./internal/mmu ./internal/storage/sqlite

      - run: go vet ./...

      - run: go build ./cmd/go-agent ./cmd/go-agentctl

  race:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -race ./...
